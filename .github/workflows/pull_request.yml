name: Pull Request

permissions:
  contents: read
  issues: write

on:
  pull_request:
    types:
      - opened
      - reopened
      # pull request's head branch was updated
      - synchronize

jobs:
  build_pull_request:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15-intel
          - macos-26
          - windows-2025
    steps:
      - name: Fetch source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "cmake;3.31.6"

      - name: Install system dependencies (Ubuntu)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          sudo apt update
          sudo apt install extra-cmake-modules gettext

      - name: Install system dependencies (macOS)
        if: ${{ startsWith(matrix.os, 'macos') }}
        run: |
          brew install extra-cmake-modules

      - name: Install system dependencies (Windows)
        if: ${{ startsWith(matrix.os, 'windows') }}
        run: |
          C:/msys64/usr/bin/pacman -Syu --noconfirm
          C:/msys64/usr/bin/pacman -S --noconfirm mingw-w64-ucrt-x86_64-gettext mingw-w64-ucrt-x86_64-extra-cmake-modules
          Add-Content $env:GITHUB_PATH "C:/msys64/ucrt64/bin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # build-logic/ contains a legacy placeholder wrapper jar (upstream
          # relic, same blob as izilooong/TapFeet) that fails v5's checksum
          # validation; the root wrapper is the one actually used to build.
          validate-wrappers: false

      - name: Unit tests (ubuntu leg)
        if: ${{ startsWith(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          if ! ./gradlew :app:testDebugUnitTest -Dkotlin.daemon.jvmargs=-Xmx4096m > utest.log 2>&1; then
            grep -iE "^e: |error:|FAILURE:|What went wrong|Execution failed|Caused by:|OutOfMemory|> Task.*FAILED|Kotlin compiler daemon|in-process" utest.log | tail -n 40 | while IFS= read -r l; do echo "::error file=utest.log::$l"; done
            exit 1
          fi

      - name: Build APK (validation)
        shell: bash
        run: |
          if ! ( ./gradlew :app:assembleDebug -Dkotlin.daemon.jvmargs=-Xmx4096m && ./gradlew :assembleDebugPlugins -Dkotlin.daemon.jvmargs=-Xmx4096m ) > build.log 2>&1; then
            grep -iE "^e: |error:|FAILURE:|What went wrong|Execution failed|Caused by:|OutOfMemory|> Task.*FAILED|Kotlin compiler daemon|in-process" build.log | tail -n 40 | while IFS= read -r l; do echo "::error file=build.log::$l"; done
            exit 1
          fi

      - name: Upload debug logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: debuglog-${{ matrix.os }}
          path: |
            build.log
            utest.log
          if-no-files-found: ignore

      - name: Post failure log tail to PR (debug)
        if: failure()
        shell: bash
        run: |
          LOG=""
          for f in utest.log build.log; do
            if [ -s "$f" ]; then LOG="$f"; break; fi
          done
          if [ -n "$LOG" ]; then
            {
              echo "CI failure log tail: os=${{ matrix.os }} file=$LOG"
              echo '=== daemon/heap lines ==='
              grep -iE "kotlin compiler daemon|in-process|jvmargs|xmx|Starting a Gradle" "$LOG" | head -n 20 | cut -c1-300
              echo '=== tail ==='
              echo '```'
              tail -n 120 "$LOG" | cut -c1-200
              echo '```'
            } > /tmp/ci_tail.md
            gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -F body_file=/tmp/ci_tail.md || true
          fi

      - name: Upload app
        uses: actions/upload-artifact@v6
        with:
          name: app-${{ matrix.os }}
          path: app/build/outputs/apk/debug/

      - name: Pack plugins
        shell: bash
        run: |
          mkdir plugins-to-upload
          for i in $(ls plugin)
          do
            if [ -d "plugin/${i}" ]
            then
              mv "plugin/${i}/build/outputs/apk/debug" "plugins-to-upload/${i}"
            fi
          done

      - name: Upload plugins
        uses: actions/upload-artifact@v6
        with:
          name: plugins-${{ matrix.os }}
          path: plugins-to-upload
